name: Diagnose Shader Hero restoration
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install release verification dependencies
        run: |
          python -m pip install -r scripts/requirements-release.txt
          python -m playwright install --with-deps chromium
      - name: Exercise the unchanged restoration acceptance condition
        run: |
          python -m pytest -q -s tests/test_shader_hero_runtime.py::test_webgl_context_restoration_waits_for_visible_cover
