name: Publish versioned runtime

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify version and explicit tag
        shell: bash
        run: |
          VERSION=$(sed -n 's/^version: //p' SKILL.md)
          TAG="v${VERSION}"
          if [ "${GITHUB_REF_TYPE}" = tag ] && [ "${GITHUB_REF_NAME}" != "${TAG}" ]; then
            echo "Tag and SKILL version disagree" >&2
            exit 1
          fi
          git rev-parse "${TAG}" >/dev/null
          # Manual dispatch can publish an already explicit tag only when its
          # runtime bytes match the selected branch.
          if [ "${GITHUB_REF_TYPE}" != tag ]; then
            git diff --exit-code "${TAG}" HEAD -- SKILL.md main.py scripts schemas references themes
            git checkout --detach "${TAG}"
          fi
          test "$(git rev-parse "${TAG}^{commit}")" = "$(git rev-parse HEAD)"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "TAG=${TAG}" >> "$GITHUB_ENV"
      - name: Build from repository runtime bytes
        shell: bash
        run: |
          mkdir -p dist
          python -m pip install -r scripts/requirements-release.txt
          python scripts/build-profile-templates.py --check
          curl --fail --silent --show-error --location https://github.com/kaisersong/slide-creator/releases/download/v2.33.0/kai-slide-creator-v2.33.0-skill-runtime.zip -o dist/previous-runtime.zip
          python scripts/package-runtime.py --output-dir dist --previous-runtime dist/previous-runtime.zip --previous-sha256 2361555dc22ea13527cf80b2a4647eb2cf5e1a7a8025f3317743468b5ba712bf
          python check-doc-sync.py
          python -m zipfile -e "dist/kai-slide-creator-${TAG}-skill-runtime.zip" dist/installed
          for theme in shader-hero molten-flow stellar-vortex; do
            python dist/installed/kai-slide-creator/main.py --generate --brief "demos/${theme}/BRIEF.json" --output "dist/${theme}-smoke.html"
          done
      - name: Verify installed profiles and complete release gate
        shell: bash
        run: |
          python -m playwright install --with-deps chromium
          python -m pytest -q tests/test_installed_profile_templates.py
          python dist/installed/kai-slide-creator/scripts/run-release-matrix.py \
            --suite "${GITHUB_WORKSPACE}/evals/preset-surface-all/manifest.json" \
            --output-dir dist/release-gate \
            --jobs 3
          python -c 'import json; r=json.load(open("dist/release-gate/release-gate-report.json")); assert r["gate"]["passed"] and r["summary"]["pass_count"] == 66 and r["summary"]["fail_count"] == 0'
      - name: Preserve release gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-gate-${{ github.run_id }}
          path: dist/release-gate
          if-no-files-found: ignore
      - name: Publish release and runtime assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          NOTES=$(find docs/design -maxdepth 1 -name "*-release-${TAG}.md" -print -quit)
          if ! gh release view "${TAG}" >/dev/null 2>&1; then
            if [ -f "${NOTES}" ]; then
              gh release create "${TAG}" --verify-tag --draft --title "${TAG}" --notes-file "${NOTES}"
            else
              gh release create "${TAG}" --verify-tag --draft --title "${TAG}" --generate-notes
            fi
          fi
          gh release upload "${TAG}" "dist/kai-slide-creator-${TAG}-skill-runtime.zip" "dist/kai-slide-creator-${TAG}-skill-runtime.zip.sha256" "dist/runtime-manifest.json" --clobber
          gh release edit "${TAG}" --draft=false --latest
