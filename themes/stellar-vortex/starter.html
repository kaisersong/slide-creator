body[data-cover-effect-ready="true"] .sh-cover-field { opacity:0; }
.sh-scene--cover::before { content:""; position:absolute; inset:0; z-index:-1; background:linear-gradient(90deg,rgba(16,12,20,.96),rgba(16,12,20,.8) 42%,rgba(16,12,20,.38) 58%,rgba(16,12,20,0) 74%); }
#cover-effect-canvas { position:fixed; inset:0; width:100%; height:100%; z-index:0; pointer-events:none; }
#cover-effect-canvas[hidden] { display:none; }
.sh-copy { max-width:1120px; }
.sh-label { display:block; margin-bottom:28px; font:12px/1.5 SFMono-Regular,Consolas,monospace; letter-spacing:.2em; color:var(--sh-teal); }
.sh-headline { font-size:clamp(32px,4vw,64px); line-height:1.24; letter-spacing:-.035em; font-weight:650; margin:0; text-wrap:balance; }
.sh-title-line { display:block; }
.sh-headline em { color:var(--sh-teal); font-style:normal; }
.sh-lede { font-size:clamp(17px,1.6vw,25px); line-height:1.65; max-width:900px; color:var(--sh-muted); margin:20px 0 0; }
.sh-scene--cover .sh-headline { font-size:clamp(46px,6.8vw,104px); line-height:1.2; max-width:1040px; }
.sh-scene--cover .sh-label,.sh-scene--closing .sh-label { color:var(--sh-light); }
.sh-scene--cover .sh-headline em,.sh-scene--closing .sh-headline em { color:var(--sh-amber); }
.sh-scene--cover .sh-lede,.sh-scene--closing .sh-lede { color:#D0DDD6; max-width:660px; }
.sh-details { width:100%; }
.sh-facts { margin:0; padding:0; list-style:none; display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:26px 38px; }
.sh-fact { border-top:1px solid var(--sh-rule); padding-top:20px; font-size:clamp(17px,1.5vw,24px); line-height:1.6; overflow-wrap:anywhere; }
.sh-index { display:block; margin-bottom:14px; color:var(--sh-teal); font:13px/1.5 SFMono-Regular,Consolas,monospace; }
.sh-evidence { font-size:17px; line-height:1.55; margin:12px 0 0; color:var(--sh-muted); }
.sh-scene--cover .sh-details { max-width:840px; margin-top:30px; }
.sh-scene--cover .sh-fact,.sh-scene--closing .sh-fact { border-color:rgba(193,231,213,.26); font-size:17px; color:#D0DDD6; }
.sh-scene--cover .sh-index,.sh-scene--closing .sh-index { color:var(--sh-light); }
.sh-scene--closing .sh-evidence { color:#D0DDD6; }
.layout-column_content.sh-scene--content { flex-direction:row; align-items:center; gap:8%; }
.layout-column_content .sh-copy { flex:1.15; }
.layout-column_content .sh-details { flex:1; }
.layout-column_content .sh-facts { grid-template-columns:1fr; }
.layout-contents_index .sh-facts { grid-template-columns:1fr; gap:0; }
.layout-contents_index .sh-fact { display:flex; gap:34px; padding:20px 0; }
.layout-contents_index .sh-index { min-width:45px; margin:0; padding-top:4px; }
.layout-geometric_diagram .sh-index { font-size:clamp(35px,4vw,64px); line-height:1.15; font-weight:400; margin-bottom:28px; }
.layout-geometric_diagram .sh-fact { padding-top:28px; }
.sh-quote { margin:0; border-left:4px solid var(--sh-teal); padding-left:38px; }
.layout-pull_quote .sh-headline { font-size:clamp(36px,5vw,76px); }
.sh-scene--closing .sh-headline { font-size:clamp(40px,5.5vw,86px); }
.slide-num-label { position:absolute; right:84px; bottom:28px; font:12px/1.5 SFMono-Regular,Consolas,monospace; letter-spacing:.13em; color:var(--sh-muted); }
.sh-scene--cover .slide-num-label,.sh-scene--closing .slide-num-label { color:var(--sh-light); }
#brand-mark { position:fixed; top:20px; right:var(--sh-pad); left:auto; z-index:9990; font:11px/1.5 SFMono-Regular,Consolas,monospace; max-width:45vw; color:var(--sh-teal); }
body:has(.sh-scene--cover.visible) #brand-mark,body:has(.sh-scene--cover.p-on) #brand-mark,body:has(.sh-scene--closing.visible) #brand-mark,body:has(.sh-scene--closing.p-on) #brand-mark { color:var(--sh-light); }
.nav-dots { position:fixed; right:22px; top:50%; transform:translateY(-50%); display:flex; flex-direction:column; gap:10px; z-index:9990; }
.nav-dots button { width:8px; height:8px; border-radius:50%; border:1px solid var(--sh-teal); background:transparent; cursor:pointer; padding:0; }
.nav-dots button.active { background:var(--sh-teal); }
body:has(.sh-scene--cover.visible) .nav-dots button,body:has(.sh-scene--cover.p-on) .nav-dots button,body:has(.sh-scene--closing.visible) .nav-dots button,body:has(.sh-scene--closing.p-on) .nav-dots button { border-color:var(--sh-light); background:rgba(16,12,20,.6); }
body:has(.sh-scene--cover.visible) .nav-dots button.active,body:has(.sh-scene--cover.p-on) .nav-dots button.active,body:has(.sh-scene--closing.visible) .nav-dots button.active,body:has(.sh-scene--closing.p-on) .nav-dots button.active { background:var(--sh-light); }
.progress-bar { position:fixed; top:0; left:0; height:3px; background:var(--sh-teal); z-index:9990; }
body[data-export-progress="false"] .progress-bar,body[data-export-progress="false"] .nav-dots { display:none; }
body.presenting.presenting-black::after { content:""; position:fixed; inset:0; background:#000; z-index:99999; }
:focus-visible { outline:2px solid var(--sh-amber); outline-offset:5px; }
@media (max-height:860px) {
  .sh-scene { gap:26px; padding-top:48px; padding-bottom:48px; }
  .sh-label { margin-bottom:18px; }
  .sh-scene--cover .sh-headline { font-size:clamp(40px,6vw,86px); }
  .sh-scene--cover .sh-details { margin-top:14px; }
  .sh-fact { padding-top:14px; }
}
@media (max-width:700px) {
  .sh-scene--cover::before { background:linear-gradient(0deg,rgba(16,12,20,.6),transparent 70%),linear-gradient(90deg,rgba(16,12,20,.92),rgba(16,12,20,.78) 70%,rgba(16,12,20,.72)); }
  .sh-scene { padding:58px 24px 64px; gap:24px; }
  .layout-column_content.sh-scene--content { flex-direction:column; align-items:stretch; gap:24px; }
  .layout-column_content .sh-copy,.layout-column_content .sh-details { flex:none; }
  .sh-facts { grid-template-columns:1fr; gap:14px; }
  .sh-fact { padding-top:12px; font-size:17px; }
  .sh-index { margin-bottom:5px; }
  .layout-geometric_diagram .sh-index { font-size:24px; margin-bottom:8px; }
  .sh-scene--cover .sh-headline { font-size:clamp(38px,9vw,64px); }
  .sh-headline,.sh-scene--closing .sh-headline { font-size:32px; }
  .sh-lede { font-size:17px; margin-top:16px; }
  .sh-scene--cover .sh-details { margin-top:0; }
  .sh-scene--cover .sh-facts { grid-template-columns:repeat(3,1fr); gap:12px; }
  .sh-scene--cover .sh-fact { font-size:13px; }
  .sh-quote { padding-left:20px; }
  .layout-pull_quote .sh-headline { font-size:36px; }
  .nav-dots { right:8px; }
  #brand-mark { font-size:10px; top:16px; }
}
@media (prefers-reduced-motion:reduce) {
  #cover-effect-canvas { display:none; }
  body[data-cover-effect-ready="true"] .sh-cover-field { opacity:1; }
  html { scroll-behavior:auto; }
}
@media print {
  #cover-effect-canvas,#brand-mark,.nav-dots,.progress-bar,#present-btn,#present-counter,.edit-hotzone,#editToggle,#notes-panel,.slide-credit { display:none !important; }
  body[data-cover-effect-ready="true"] .sh-cover-field { opacity:1; }
  html,body { height:auto; overflow:visible; }
  .slide { width:1440px; height:900px; break-after:page; print-color-adjust:exact; -webkit-print-color-adjust:exact; }
}

.sh-scene--cover .sh-headline { max-width:1000px; }
.sh-scene--cover .sh-details { max-width:740px; }

  "period": 144,
