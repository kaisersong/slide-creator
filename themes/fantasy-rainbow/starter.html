<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fantasy Rainbow Theme Starter</title>
<style>
:root {
  --iri-ink: #0a0a12;
  --iri-ink-soft: #252532;
  --iri-accent-blue: #5B6CFF;
  --iri-accent-purple: #9B5CFF;
  --iri-accent-cyan: #20BFC4;
  --iri-accent-blue-text: #4152CC;
  --iri-accent-purple-text: #7037D8;
  --iri-accent-cyan-text: #007B83;
  --iri-tint-blue: rgba(91, 108, 255, .08);
  --iri-tint-purple: rgba(155, 92, 255, .08);
  --iri-tint-cyan: rgba(32, 191, 196, .08);
  --iri-cover-keyword-veil-alpha: .81;
  --iri-blue: var(--iri-accent-blue);
  --iri-line: rgba(10, 10, 18, .20);
  --iri-paper: rgba(255, 255, 255, .26);
  --iri-display: "Space Grotesk", "Noto Sans SC", "Helvetica Neue", Arial, sans-serif;
  --iri-mono: "JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace;
  --kd-blue: var(--iri-blue);
  --text-secondary: var(--iri-ink-soft);
}

*, *::before, *::after { box-sizing: border-box; }
html { min-height: 100%; }
body {
  margin: 0;
  min-height: 100%;
  color: var(--iri-ink);
  background-color: #eef7ff;
  background-image:
    linear-gradient(156deg, rgba(87, 229, 233, .88) 0%, rgba(87, 229, 233, 0) 36%),
    linear-gradient(28deg, rgba(167, 108, 255, .48) 2%, rgba(167, 108, 255, 0) 34%),
    linear-gradient(122deg, rgba(125, 112, 255, .80) 12%, rgba(255, 255, 255, .28) 44%, rgba(83, 222, 212, .76) 76%, rgba(151, 122, 255, .52) 100%);
  font-family: var(--iri-display);
  -webkit-font-smoothing: antialiased;
  scroll-snap-type: y mandatory;
  overflow-y: auto;
  overflow-x: hidden;
}
body::before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: -2;
  pointer-events: none;
  background:
    linear-gradient(164deg, transparent 0 29%, rgba(255,255,255,.82) 30% 35%, transparent 36% 100%),
    linear-gradient(22deg, transparent 0 48%, rgba(107,126,255,.72) 49% 51%, rgba(255,255,255,.76) 52% 55%, transparent 56% 100%);
}

#iridescence-canvas {
  position: fixed;
  inset: 0;
  width: 100vw;
  height: 100vh;
  z-index: -1;
  pointer-events: none;
  opacity: 1;
}
#iridescence-canvas[hidden],
body[data-iridescence-active="false"] #iridescence-canvas { display: none; opacity: 0; visibility: hidden; }
body[data-iridescence-fallback="true"] #iridescence-canvas { opacity: 0; }

/* Optional cover stars share the cover lifecycle, including pseudo-elements. */
body { --iri-cover-play-state: paused; }
body[data-cover-animating="true"] { --iri-cover-play-state: running; }
:is(.iri-scene--hero, [data-cover-animation]),
:is(.iri-scene--hero, [data-cover-animation])::before,
:is(.iri-scene--hero, [data-cover-animation])::after,
:is(.iri-scene--hero, [data-cover-animation]) *,
:is(.iri-scene--hero, [data-cover-animation]) *::before,
:is(.iri-scene--hero, [data-cover-animation]) *::after {
  animation-play-state: var(--iri-cover-play-state) !important;
}

.slide {
  position: relative;
  z-index: 1;
  width: 100vw;
  min-height: 100vh;
  height: 100vh;
  aspect-ratio: 16 / 9;
  overflow: hidden;
  scroll-snap-align: start;
  scroll-snap-stop: always;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: clamp(42px, 5.8vh, 64px) clamp(42px, 4.5vw, 66px);
  background: transparent;
  isolation: isolate;
  /* Keep the presentation viewport scale static; never animate a full slide. */
  animation: none !important;
  transition: none !important;
  will-change: auto;
}
.slide::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  background: linear-gradient(180deg, rgba(255,255,255,.08) 0%, rgba(255,255,255,.02) 40%, rgba(255,255,255,.45) 100%);
}

.iri-scene--hero { background: transparent; }
.iri-scene:not(.iri-scene--hero):not(.iri-scene--closing) {
  background: #fff;
  color: var(--iri-ink);
}
.iri-scene:not(.iri-scene--hero)::before { display: none; }
.iri-scene:not(.iri-scene--hero) .iri-headline { text-shadow: none; }
.iri-scene--closing {
  background: #0a0a12;
  color: #f7f7fb;
}

h1, h2, h3, p { margin-top: 0; }
h1, h2, h3 { color: var(--iri-ink); text-wrap: balance; }
p, li { text-wrap: pretty; }

.iri-scene { align-items: flex-start; }
.iri-copy { position: relative; z-index: 2; }
.iri-label,
.iri-fact-index,
.iri-fact-label,
.iri-micro,
.slide-credit,
.section-number,
.toc-number,
.toc-page {
  font-family: var(--iri-mono);
  text-transform: uppercase;
  letter-spacing: .16em;
}
.iri-label {
  display: block;
  width: fit-content;
  margin-bottom: clamp(16px, 2.4vh, 24px);
  color: rgba(10,10,18,.64);
  font-size: clamp(9px, .82vw, 12px);
  font-weight: 500;
}
.iri-headline {
  max-width: 1120px;
  margin: 0;
  color: var(--iri-ink);
  font-size: clamp(54px, 7.5vw, 108px);
  font-weight: 800;
  line-height: .93;
  letter-spacing: -.055em;
  text-shadow: 0 1px 18px rgba(255,255,255,.20);
}
.iri-headline em { font-style: normal; }
.iri-scene--hero .iri-headline em.iri-accent-primary { display: inline-block; position: relative; isolation: isolate; }
.iri-scene--hero .iri-headline em.iri-accent-primary::before {
  content: "";
  position: absolute;
  inset: -.12em -.20em;
  z-index: -1;
  background: radial-gradient(ellipse at center, rgba(255,255,255,var(--iri-cover-keyword-veil-alpha)) 0%, rgba(255,255,255,var(--iri-cover-keyword-veil-alpha)) 38%, rgba(255,255,255,0) 78%);
  filter: blur(.09em);
  pointer-events: none;
}
.iri-title-line { display: block; }
.iri-scene--hero .iri-title-line + .iri-title-line { margin-top: .08em; }
.iri-lead {
  max-width: 760px;
  margin: clamp(18px, 2.8vh, 28px) 0 0;
  color: var(--iri-ink-soft);
  font-size: clamp(16px, 1.45vw, 21px);
  line-height: 1.52;
  font-weight: 500;
}
.iri-facts {
  display: flex;
  flex-wrap: wrap;
  gap: clamp(24px, 4vw, 58px);
  margin-top: clamp(26px, 4.2vh, 44px);
}
.iri-fact {
  min-width: 118px;
  padding: 13px 0 0;
  border-top: 1px solid rgba(10,10,18,.46);
}
.iri-fact-index { display: block; color: var(--iri-ink); font-size: 9px; }
.iri-fact-label { display: block; color: rgba(10,10,18,.56); font-size: 9px; }
.iri-fact strong { display: block; margin-top: 8px; color: var(--iri-ink); font-size: clamp(15px, 1.42vw, 21px); line-height: 1.25; }

.iri-panel {
  color: #f9fbff;
  background: #0a0a12;
  border: 1px solid rgba(255,255,255,.22);
  box-shadow: 16px 18px 0 rgba(91,108,255,.28);
}
.iri-panel code, .iri-panel pre { color: inherit; font-family: var(--iri-mono); }
.iri-rule { height: 1px; background: rgba(10,10,18,.48); }
.iri-number { color: var(--iri-ink); font-family: var(--iri-mono); font-weight: 700; }
.iri-muted { color: rgba(10,10,18,.58); }
.iri-scene:not(.iri-scene--hero):not(.iri-scene--convergence):not(.iri-scene--closing) > .iri-copy {
  width: min(92vw, 1320px);
  margin-bottom: clamp(20px, 3vh, 32px);
}
.iri-scene:not(.iri-scene--hero):not(.iri-scene--convergence):not(.iri-scene--closing) > .iri-copy .iri-headline {
  max-width: 1260px;
  font-size: clamp(40px, 4.55vw, 68px);
  line-height: .96;
  letter-spacing: -.05em;
}

/* 01 — hero */
.iri-scene--hero { justify-content: center; }
.iri-scene--hero .iri-copy { width: min(78vw, 1120px); }
.iri-scene--hero .iri-label { color: var(--iri-ink); }
.iri-scene--hero .iri-headline { max-width: 1020px; }
.iri-scene--hero .iri-facts { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: clamp(18px, 2.8vw, 44px); width: min(86vw, 1140px); max-width: none; }

/* 02 — fracture */
.iri-fracture-grid { width: min(91vw, 1310px); display: grid; grid-template-columns: 1fr 74px 1fr; gap: 24px; align-items: stretch; }
.iri-fracture-side { display: grid; align-content: start; gap: 0; }
.iri-fracture-side h3 { margin: 0 0 20px; font: 600 12px var(--iri-mono); letter-spacing: .14em; text-transform: uppercase; }
.iri-fracture-item { padding: 16px 0; border-top: 1px solid rgba(10,10,18,.42); font-size: clamp(15px, 1.25vw, 19px); font-weight: 650; }
.iri-fracture-scar { position: relative; }
.iri-fracture-scar::before { content: ""; position: absolute; left: 50%; top: -5%; bottom: -5%; width: 5px; transform: skew(-14deg); background: #0a0a12; box-shadow: 10px 0 0 var(--iri-accent-blue); }

/* 03 — convergence */
.iri-scene--convergence { align-items: center; text-align: center; }
.iri-convergence-core { position: relative; width: min(90vw, 1260px); }
.iri-convergence-core .iri-headline { margin: 0 auto; max-width: 1200px; }
.iri-scene--convergence .iri-headline { font-size: clamp(48px, 5.4vw, 80px); line-height: .94; }
.iri-convergence-word { display: block; margin: 10px 0 -4px; font-size: clamp(76px, 13vw, 188px); font-weight: 800; line-height: .8; letter-spacing: -.08em; }
.iri-convergence-lines { display: grid; grid-template-columns: repeat(3, 1fr); gap: 34px; margin-top: 34px; text-align: left; }
.iri-convergence-lines .iri-fact { min-width: 0; }

/* 04 — brief */
.iri-brief-layout { width: min(91vw, 1310px); display: grid; grid-template-columns: .82fr 1.18fr; gap: clamp(34px, 5vw, 76px); align-items: center; }
.iri-scene--brief .iri-headline { font-size: clamp(38px, 3.6vw, 54px); line-height: .96; }
.iri-brief-code { padding: clamp(24px, 3vw, 38px); min-height: 430px; display: grid; align-content: center; }
.iri-brief-code strong { font-size: clamp(36px, 5.5vw, 80px); letter-spacing: -.055em; }
.iri-brief-code pre { margin: 28px 0 0; white-space: pre-wrap; font-size: clamp(11px, .9vw, 14px); line-height: 1.7; }
.iri-field-list { display: grid; gap: 0; }
.iri-field { display: grid; grid-template-columns: 42px 180px 1fr; gap: 14px; padding: 14px 0; border-top: 1px solid rgba(10,10,18,.42); align-items: baseline; }
.iri-field code { font: 600 clamp(12px, 1vw, 15px) var(--iri-mono); }
.iri-field span:last-child { font-size: clamp(14px, 1.08vw, 17px); }

/* 05 — pipeline */
.iri-pipeline { width: min(88vw, 1260px); display: grid; grid-template-columns: repeat(6, 1fr); border-top: 2px solid var(--iri-ink); border-bottom: 2px solid var(--iri-ink); }
.iri-pipeline-step { min-height: 190px; padding: 22px 16px; border-right: 1px solid rgba(10,10,18,.4); display: grid; align-content: space-between; background: #fff; }
.iri-pipeline-step:last-child { border-right: 0; }
.iri-pipeline-step span { font: 700 10px var(--iri-mono); letter-spacing: .16em; }
.iri-pipeline-step strong { font-size: clamp(14px, 1.22vw, 19px); line-height: 1.25; }

/* 06 — spectrum */
.iri-spectrum { width: min(92vw, 1320px); display: grid; grid-template-columns: 300px 1fr; gap: 54px; align-items: end; }
.iri-spectrum-total { font-size: clamp(150px, 22vw, 320px); line-height: .68; font-weight: 800; letter-spacing: -.09em; }
.iri-spectrum-list { display: grid; grid-template-columns: repeat(2, 1fr); border-top: 2px solid var(--iri-ink); }
.iri-spectrum-item { padding: 18px 0; border-bottom: 1px solid rgba(10,10,18,.42); display: flex; align-items: center; gap: 12px; color: var(--iri-ink); font-size: clamp(14px, 1.15vw, 18px); font-weight: 650; }
.iri-spectrum-item:nth-child(odd) { padding-right: 28px; }
.iri-spectrum-marker { width: 9px; height: 9px; flex: 0 0 9px; background: var(--iri-ink); }
.iri-spectrum-marker.iri-marker-primary { background: var(--iri-accent-blue); }
.iri-spectrum-marker.iri-marker-secondary { background: var(--iri-accent-purple); }
.iri-spectrum-marker.iri-marker-tertiary { background: var(--iri-accent-cyan); }

/* 07 — contract */
.iri-contract { width: min(91vw, 1310px); display: grid; gap: 0; border-top: 2px solid var(--iri-ink); }
.iri-contract-layer { display: grid; grid-template-columns: 66px 260px 1fr; gap: 22px; padding: 18px 0; border-bottom: 1px solid rgba(10,10,18,.44); align-items: center; }
.iri-contract-layer strong { font-size: clamp(18px, 1.6vw, 24px); }
.iri-contract-layer p { margin: 0; font-size: clamp(14px, 1.08vw, 17px); }

/* 08 — gates */
.iri-gates { width: min(92vw, 1330px); display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; }
.iri-gate { min-height: 300px; padding: 24px 20px; border-left: 8px solid var(--iri-ink); display: grid; grid-template-rows: auto 1fr auto; background: #f4f4f8; }
.iri-gate span { color: var(--iri-ink); font: 700 10px var(--iri-mono); letter-spacing: .15em; }
.iri-gate strong { align-self: center; font-size: clamp(21px, 2vw, 30px); line-height: 1.05; }
.iri-gate small { font: 500 clamp(12px, .9vw, 13px)/1.5 var(--iri-mono); }

/* 09 — runtime */
.iri-runtime-stage { width: min(91vw, 1310px); min-height: 390px; border: 2px solid var(--iri-ink); display: grid; grid-template-columns: 1.3fr .7fr; }
.iri-runtime-screen { padding: 30px; display: grid; align-content: center; border-right: 1px solid var(--iri-ink); }
.iri-runtime-screen strong { max-width: 650px; font-size: clamp(38px, 5vw, 76px); line-height: .95; letter-spacing: -.05em; }
.iri-keys { display: grid; grid-template-columns: 1fr 1fr; }
.iri-key { min-height: 96px; padding: 18px; border-right: 1px solid rgba(10,10,18,.4); border-bottom: 1px solid rgba(10,10,18,.4); }
.iri-key:nth-child(even) { border-right: 0; }
.iri-key b { display: block; font: 700 18px var(--iri-mono); }
.iri-key span { display: block; margin-top: 9px; font-size: clamp(12px, .94vw, 14px); }

/* 10 — modes */
.iri-modes { width: min(91vw, 1310px); display: grid; grid-template-columns: 1fr 1fr; border-top: 2px solid var(--iri-ink); border-bottom: 2px solid var(--iri-ink); }
.iri-mode { min-height: 320px; padding: 28px 34px; display: grid; align-content: space-between; }
.iri-mode + .iri-mode { border-left: 1px solid var(--iri-ink); }
.iri-mode .iri-number { font-size: clamp(64px, 8vw, 116px); line-height: .8; letter-spacing: -.07em; }
.iri-mode h3 { margin: 20px 0 0; font-size: clamp(32px, 4vw, 60px); }
.iri-mode p { margin: 0; max-width: 470px; font-size: clamp(14px, 1.15vw, 18px); line-height: 1.5; }

/* 11 — use cases */
.iri-quadrants { width: min(91vw, 1310px); display: grid; grid-template-columns: 1fr 1fr; border-top: 2px solid var(--iri-ink); border-left: 2px solid var(--iri-ink); }
.iri-quadrant { min-height: 176px; padding: 20px 24px; border-right: 2px solid var(--iri-ink); border-bottom: 2px solid var(--iri-ink); display: grid; grid-template-columns: 50px 1fr; gap: 16px; }
.iri-quadrant strong { font-size: clamp(18px, 1.7vw, 26px); }
.iri-quadrant p { grid-column: 2; margin: 0; font-size: clamp(12px, 1vw, 15px); line-height: 1.45; }

/* Structured relationship scenes */
.iri-structured-tags, .iri-structured-items { display: flex; flex-wrap: wrap; gap: 5px; }
.iri-structured-tag, .iri-structured-item { padding: 3px 7px; border: 1px solid rgba(10,10,18,.22); background: #fff; font-size: clamp(10px, .78vw, 12px); line-height: 1.2; }

.iri-interaction-layout { width: min(92vw, 1330px); display: grid; grid-template-columns: minmax(0, 1.65fr) minmax(260px, .65fr); gap: 28px; align-items: stretch; }
.iri-interaction-flow, .iri-poll { border-top: 2px solid var(--iri-ink); }
.iri-interaction-flow { padding-top: 14px; }
.iri-interaction-flow h3 { margin: 0; font-size: clamp(19px, 1.55vw, 24px); }
.iri-interaction-flow > p { margin: 8px 0 12px; font-size: clamp(13px, 1.02vw, 16px); line-height: 1.4; }
.iri-interaction-steps { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); margin-top: 14px; border: 1px solid var(--iri-ink); }
.iri-interaction-step { min-height: 150px; padding: 18px; border-right: 1px solid var(--iri-ink); display: grid; align-content: start; gap: 8px; }
.iri-interaction-step:last-child { border-right: 0; }
.iri-interaction-step strong { font-size: clamp(16px, 1.25vw, 20px); }
.iri-interaction-step p { margin: 0; font-size: clamp(11px, .88vw, 14px); line-height: 1.4; }
.iri-interaction-edge { display: inline-block; margin: 10px 12px 0 0; color: var(--iri-accent-blue-text); font: 700 10px var(--iri-mono); }
.iri-poll { padding: 18px 20px; background: var(--iri-tint-purple); display: grid; align-content: start; gap: 12px; }
.iri-poll > span { color: var(--iri-accent-purple-text); font: 700 11px var(--iri-mono); letter-spacing: .12em; }
.iri-poll > p { margin: 0; font-size: clamp(18px, 1.7vw, 26px); font-weight: 700; }
.iri-poll-options { display: grid; gap: 10px; margin-top: 8px; }
.iri-poll-option { min-height: 86px; padding: 15px 18px; border: 1px solid var(--iri-ink); background: #fff; display: grid; align-content: center; gap: 5px; }
.iri-poll-option strong { font-size: clamp(22px, 2vw, 30px); }
.iri-poll-option p { margin: 0; font-size: 12px; }

.iri-scene--layered-architecture > .iri-copy { margin-bottom: 10px !important; }
.iri-scene--layered-architecture > .iri-copy .iri-headline { font-size: clamp(32px, 3.5vw, 50px) !important; }
.iri-scene--layered-architecture > .iri-copy .iri-lead { margin-top: 8px; font-size: clamp(13px, 1vw, 16px); }
.iri-layered-architecture { width: min(94vw, 1360px); display: grid; grid-template-columns: minmax(0, 1.62fr) minmax(280px, .58fr); grid-template-rows: 1fr auto; gap: 12px 24px; }
.iri-layered-architecture-main { display: grid; align-content: start; }
.iri-layered-architecture-layer { min-height: 56px; padding: 8px 14px; border: 1px solid rgba(10,10,18,.30); border-left: 6px solid var(--iri-accent-blue); display: grid; grid-template-columns: 190px minmax(0, 1fr); gap: 5px 14px; align-items: center; background: #fff; }
.iri-layered-architecture-layer:nth-of-type(4n+1) { border-left-color: var(--iri-accent-purple); background: var(--iri-tint-purple); }
.iri-layered-architecture-layer:nth-of-type(4n+3) { border-left-color: var(--iri-accent-cyan); background: var(--iri-tint-cyan); }
.iri-layered-architecture-layer > strong { font-size: clamp(15px, 1.2vw, 19px); }
.iri-layered-architecture-layer > p { margin: 0; font-size: clamp(11px, .86vw, 13px); line-height: 1.3; }
.iri-layered-architecture-details { grid-column: 2; display: flex; flex-wrap: wrap; gap: 3px 10px; }
.iri-layered-architecture-details span { font-size: clamp(10.5px, .8vw, 12.5px); line-height: 1.25; }
.iri-layered-architecture-edge { height: 14px; color: rgba(10,10,18,.45); text-align: center; font-size: 0; line-height: 14px; }
.iri-layered-architecture-edge::after { content: "↓"; font-size: 14px; }
.iri-architecture-rails { display: grid; grid-template-rows: auto 1fr 1fr; gap: 9px; }
.iri-architecture-rails > h2 { margin: 0; padding: 6px 10px; border-bottom: 1px solid rgba(10,10,18,.22); font-size: clamp(15px, 1.2vw, 18px); text-align: center; }
.iri-architecture-rail { padding: 10px 13px; border-left: 6px solid var(--iri-accent-purple); background: var(--iri-tint-purple); display: grid; align-content: start; gap: 4px; }
.iri-architecture-rail:nth-of-type(2) { border-left-color: var(--iri-accent-blue); background: var(--iri-tint-blue); }
.iri-architecture-rail h3 { margin: 0 0 4px; font-size: clamp(15px, 1.2vw, 19px); }
.iri-architecture-rail span { font-size: clamp(10.5px, .8vw, 12.5px); line-height: 1.3; }
.iri-architecture-bands { grid-column: 1 / -1; }
.iri-architecture-band { min-height: 42px; padding: 8px 14px; border: 1px solid rgba(10,10,18,.25); display: grid; grid-template-columns: 160px 1fr; gap: 12px; align-items: center; }
.iri-architecture-band strong { color: var(--iri-accent-blue-text); font-size: 13px; }
.iri-architecture-band span { font-size: clamp(10.5px, .82vw, 13px); }

.iri-scene--layered-call-graph { padding-top: clamp(14px, 2vh, 26px); padding-bottom: clamp(14px, 2vh, 26px); }
.iri-scene--layered-call-graph > .iri-copy { margin-bottom: 7px !important; }
.iri-scene--layered-call-graph > .iri-copy .iri-headline { font-size: clamp(28px, 3vw, 42px) !important; line-height: 1; }
.iri-layered-call-graph { width: min(96vw, 1390px); display: grid; align-content: start; }
.iri-call-graph-layer { min-height: 83px; border: 1px solid rgba(10,10,18,.32); border-top: 5px solid var(--iri-accent-blue); display: grid; grid-template-columns: 150px minmax(0, 1fr); background: #fff; }
.iri-call-graph-layer:nth-of-type(2) { border-top-color: var(--iri-accent-purple); }
.iri-call-graph-layer:nth-of-type(3) { border-top-color: var(--iri-accent-cyan); }
.iri-call-graph-layer:nth-of-type(4) { border-top-color: #D17A00; }
.iri-call-graph-layer--foundation { min-height: 58px; border-top-color: #D52828; }

<script data-theme-runtime>

      this.testTime = null;
      this.startedAt = performance.now();
      this.lastFrameAt = 0;
      this.intervals = [];
      this.drawCount = 0;
      this.lossExtension = null;
      this.slides = Array.from(document.querySelectorAll(".slide"));
      this.cover = this.slides[0];
      this.slideObserver = null;
      this.motion = matchMedia("(prefers-reduced-motion: reduce)");
      this.vertexSource = "attribute vec2 uv;attribute vec2 position;varying vec2 vUv;void main(){vUv=uv;gl_Position=vec4(position,0.0,1.0);}";
      this.fragmentSource = [
        "precision highp float;",
        "uniform float uTime;uniform vec3 uResolution;varying vec2 vUv;",
        "void main(){",
        "float mr=min(uResolution.x,uResolution.y);",
        "vec2 uv=(vUv.xy*2.0-1.0)*uResolution.xy/mr;",
        "float d=-uTime*0.5;float a=0.0;",
        "for(float i=0.0;i<8.0;++i){a+=cos(i-d-a*uv.x);d+=sin(uv.y*i+a);}",
        "d+=uTime*0.5;",
        "vec3 col=vec3(cos(uv*vec2(d,a))*0.6+0.4,cos(a+d)*0.5+0.5);",
        "col=cos(col*cos(vec3(d,a,2.5))*0.5+0.5)*vec3(0.9843137,0.9921569,1.0);",
        "float warmBias=clamp((col.r-col.g-0.02)*4.0,0.0,1.0);",
        "vec3 shifted=col;",
        "shifted.r=col.r*0.82+col.b*0.04;",
        "shifted.b=min(1.0,col.b*1.08+col.r*0.16);",
        "col=mix(col,shifted,warmBias);",
        "gl_FragColor=vec4(col,1.0);",
        "}"
      ].join("\n");
      this.bindLifecycle();
      this.sync();
    }

    compileShader(type, source) {
      const shader = this.gl.createShader(type);
      if (!shader) throw new Error("shader-create-failed");
      this.gl.shaderSource(shader, source);
      this.gl.compileShader(shader);
      if (!this.gl.getShaderParameter(shader, this.gl.COMPILE_STATUS)) {
        const detail = this.gl.getShaderInfoLog(shader) || "shader-compile-failed";
        this.gl.deleteShader(shader);
        throw new Error(detail);
      }
      return shader;
    }

    init() {
      if (this.ready || this.contextLost || this.motion.matches) return this.ready;
      try {
        this.gl = this.canvas.getContext("webgl", { antialias: true, alpha: false, preserveDrawingBuffer: true });
        if (!this.gl) throw new Error("webgl-unavailable");
        const vertex = this.compileShader(this.gl.VERTEX_SHADER, this.vertexSource);
        const fragment = this.compileShader(this.gl.FRAGMENT_SHADER, this.fragmentSource);
        this.program = this.gl.createProgram();
        if (!this.program) throw new Error("program-create-failed");
        this.gl.attachShader(this.program, vertex);
        this.gl.attachShader(this.program, fragment);
        this.gl.linkProgram(this.program);
        this.gl.deleteShader(vertex);
        this.gl.deleteShader(fragment);
        if (!this.gl.getProgramParameter(this.program, this.gl.LINK_STATUS)) {
          throw new Error(this.gl.getProgramInfoLog(this.program) || "program-link-failed");
        }
        this.gl.useProgram(this.program);
        this.buffer = this.gl.createBuffer();
        this.gl.bindBuffer(this.gl.ARRAY_BUFFER, this.buffer);
        this.gl.bufferData(this.gl.ARRAY_BUFFER, new Float32Array([-1,-1,0,0, 1,-1,1,0, 1,1,1,1, -1,1,0,1]), this.gl.STATIC_DRAW);
        const position = this.gl.getAttribLocation(this.program, "position");
        const uv = this.gl.getAttribLocation(this.program, "uv");
        if (position < 0 || uv < 0) throw new Error("attribute-location-failed");
        this.gl.enableVertexAttribArray(position);
        this.gl.vertexAttribPointer(position, 2, this.gl.FLOAT, false, 16, 0);
        this.gl.enableVertexAttribArray(uv);
        this.gl.vertexAttribPointer(uv, 2, this.gl.FLOAT, false, 16, 8);
        this.uniforms = {
          time: this.gl.getUniformLocation(this.program, "uTime"),
          resolution: this.gl.getUniformLocation(this.program, "uResolution")
        };
        if (!this.uniforms.time || !this.uniforms.resolution) throw new Error("uniform-location-failed");
        this.ready = true;
        this.startedAt = performance.now();
        document.body.dataset.iridescenceFallback = "false";
        delete this.canvas.dataset.fallbackReason;
        return true;
      } catch (error) {
        this.fallback(error && error.message);
        return false;
      }
    }

    fallback(reason) {
      this.stop();
      this.ready = false;
      document.body.dataset.iridescenceFallback = "true";
      this.canvas.dataset.fallbackReason = String(reason || "webgl-unavailable");
    }

    resize() {
      if (!this.ready) return false;
      const rect = this.canvas.getBoundingClientRect();
      if (rect.width < 2 || rect.height < 2) return false;
      const dpr = Math.max(.65, Math.min(devicePixelRatio || 1, 1.5, 2560 / rect.width, 1440 / rect.height));
      const width = Math.round(rect.width * dpr);
      const height = Math.round(rect.height * dpr);
      if (this.canvas.width !== width || this.canvas.height !== height) {
        this.canvas.width = width;
        this.canvas.height = height;
      }
      return true;
    }

    draw(seconds) {
      if (!this.ready || this.contextLost || !this.resize()) return false;
      const now = performance.now();
      if (this.lastFrameAt) {
        this.intervals.push(now - this.lastFrameAt);
        if (this.intervals.length > 720) this.intervals.shift();
      }
      this.lastFrameAt = now;
      this.drawCount += 1;
      this.gl.useProgram(this.program);
      // The field repeats every 4π seconds (uTime * 0.5 is an angle).
      // Wrap in JS double precision before uploading a float to the GPU:
      // large times quantize the iterative field into bands and blocks.
      const cycle = 4 * Math.PI;
      const phase = ((seconds % cycle) + cycle) % cycle;
      this.gl.uniform1f(this.uniforms.time, phase);
      this.gl.uniform3f(this.uniforms.resolution, this.canvas.width, this.canvas.height, 1);
      this.gl.viewport(0, 0, this.canvas.width, this.canvas.height);
      this.gl.drawArrays(this.gl.TRIANGLE_FAN, 0, 4);
      return true;
    }

    shouldAnimate() {
      return this.active && this.ready && !this.contextLost && !this.suspended() && this.testTime === null;
    }

    suspended() {
      return this.printing || this.pageHidden || document.hidden || this.motion.matches || document.body.classList.contains("presenting-black");
    }

    frame = (now) => {
      this.rafId = 0;
      if (!this.shouldAnimate()) {
        document.body.dataset.coverAnimating = "false";
        this.stop();
        return;
      }
      this.draw((now - this.startedAt) / 1000);
      this.rafId = requestAnimationFrame(this.frame);
    };

    start() {
      if (this.shouldAnimate() && !this.rafId) this.rafId = requestAnimationFrame(this.frame);
    }

    stop() {
      if (this.rafId) cancelAnimationFrame(this.rafId);
      this.rafId = 0;
      this.lastFrameAt = 0;
    }

    activeIndex() {
      const slides = this.slides;
      if (document.body.classList.contains("presenting")) {
        const presented = slides.findIndex((slide) => slide.classList.contains("p-on"));
        if (presented >= 0) return presented;
      }
      const center = innerHeight / 2;
      const nearest = slides
        .map((slide, index) => ({ index, distance: Math.abs(slide.getBoundingClientRect().top + slide.getBoundingClientRect().height / 2 - center) }))
        .sort((left, right) => left.distance - right.distance)[0];
      return nearest ? nearest.index : 0;
    }

    isCoverActive() {
      if (!this.cover) return false;
      if (document.body.classList.contains("presenting")) return this.cover.classList.contains("p-on");
      // Navigation marks the target before smooth scrolling finishes. Stop at once
      // when leaving, and wait until the cover is actually back in view to resume.
      if (!this.cover.classList.contains("visible") && this.slides.some((slide) => slide.classList.contains("visible"))) return false;
      const rect = this.cover.getBoundingClientRect();
      return rect.height > 0 && rect.top <= innerHeight / 2 && rect.bottom > innerHeight / 2;
    }

    sync() {
      this.active = this.isCoverActive();
      document.body.dataset.iridescenceActive = String(this.active);
      this.canvas.hidden = !this.active;
      const suspended = this.suspended();
      document.body.dataset.coverAnimating = String(this.active && !suspended && this.testTime === null);
      if (!this.active || suspended) { this.stop(); return; }
      if (this.testTime !== null) this.stop();
      if (!this.ready && !this.contextLost) this.init();
      if (!this.ready) return;
      const seconds = this.testTime === null ? Math.max(0, (performance.now() - this.startedAt) / 1000) : this.testTime;
      if (!this.rafId) this.draw(seconds);
      this.start();
    }

    bindLifecycle() {
      this.canvas.addEventListener("webglcontextlost", (event) => {
        event.preventDefault();
        this.contextLost = true;
        this.fallback("webgl-context-lost");
      });
      this.canvas.addEventListener("webglcontextrestored", () => {
        this.stop();
        this.contextLost = false;
        this.gl = null;
        this.program = null;
        this.buffer = null;
        this.uniforms = null;
        this.ready = false;
        this.sync();
      });
      document.addEventListener("visibilitychange", () => this.sync());
      addEventListener("resize", () => this.sync());
      addEventListener("fullscreenchange", () => this.sync());
      addEventListener("scroll", () => this.sync(), { passive: true });
      addEventListener("beforeprint", () => { this.printing = true; this.sync(); });
      addEventListener("afterprint", () => { this.printing = false; this.sync(); });
      addEventListener("pagehide", () => { this.pageHidden = true; this.sync(); });
      addEventListener("pageshow", () => { this.pageHidden = false; this.sync(); });
      const motionChange = () => this.sync();
      if (this.motion.addEventListener) this.motion.addEventListener("change", motionChange);
      else this.motion.addListener(motionChange);
      this.slideObserver = new MutationObserver(() => this.sync());
      this.slideObserver.observe(document.body, { attributes: true, attributeFilter: ["class"] });
      this.slides.forEach((slide) => {
        this.slideObserver.observe(slide, { attributes: true, attributeFilter: ["class"] });
      });
    }

    setDeterministicTime(value) {
      this.testTime = value === null ? null : Number(value);
      this.sync();
      return this.state();
    }

    forceFallback() {
      this.fallback("qa-forced-fallback");
      return this.state();
    }

    loseContext() {
      this.lossExtension = this.gl && this.gl.getExtension("WEBGL_lose_context");
      if (this.lossExtension) this.lossExtension.loseContext();
      return Boolean(this.lossExtension);
    }

    restoreContext() {
      if (this.lossExtension) this.lossExtension.restoreContext();
      return Boolean(this.lossExtension);
    }

    getFrameStats() {
      const sorted = this.intervals.slice().sort((a, b) => a - b);
      const p95 = sorted.length ? sorted[Math.min(sorted.length - 1, Math.floor(sorted.length * .95))] : 0;
      return { drawCount: this.drawCount, samples: sorted.length, p95FrameInterval: p95 };
    }

    state() {
      return {
        active: this.active,
        ready: this.ready,
        fallback: document.body.dataset.iridescenceFallback === "true",
        contextLost: this.contextLost,
        reducedMotion: this.motion.matches,
        activeIndex: this.activeIndex(),
        canvasHidden: this.canvas.hidden,
        rafActive: Boolean(this.rafId),
        activeRafCount: this.rafId ? 1 : 0,
        canvasWidth: this.canvas.width,
        canvasHeight: this.canvas.height,
        ...this.getFrameStats()
      };
    }
  }

  const canvas = document.getElementById("iridescence-canvas");
  if (!canvas) return;
  const controller = new IridescenceController(canvas);
  window.__iridescenceQA = {
    setDeterministicTime: (value) => controller.setDeterministicTime(value),
    forceFallback: () => controller.forceFallback(),
    loseContext: () => controller.loseContext(),
    restoreContext: () => controller.restoreContext(),
    getFrameStats: () => controller.getFrameStats(),
    state: () => controller.state(),
    sync: () => controller.sync()
  };
})();
</script>
</body>
</html>
